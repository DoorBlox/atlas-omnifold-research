name: ATLAS Phase 7 lightweight scientific checks

on:
  push:
    branches: [main]
    paths:
      - "src/phase7_snapshot.py"
      - "src/phase7_divisor_audit.py"
      - "src/phase7_interaction.py"
      - "src/phase7_target_mc.py"
      - "src/phase7_crosscov_bounds.py"
      - "src/phase7_model_sensitivity.py"
      - "src/phase7_calibration.py"
      - "src/phase7_reference_audit.py"
      - "src/phase7_v2_reconstruct.py"
      - "src/phase7_twopoint_protocol.py"
      - "src/phase7_official_helper_audit.py"
      - "src/phase7_joint_reference.py"
      - "src/phase7_conditional_null.py"
      - "src/phase7_empirical_replica_null.py"
      - "src/phase7_replica_projection_audit.py"
      - "src/phase7_official_excerpts.py"
      - "tests/test_phase7_snapshot.py"
      - "tests/test_phase7_divisor_audit.py"
      - "tests/test_phase7_interaction.py"
      - "tests/test_phase7_target_mc.py"
      - "tests/test_phase7_crosscov_bounds.py"
      - "tests/test_phase7_model_sensitivity.py"
      - "tests/test_phase7_calibration.py"
      - "tests/test_phase7_replica_manifest.py"
      - "tests/test_phase7_reference_audit.py"
      - "tests/test_phase7_v2_reconstruct.py"
      - "tests/test_phase7_twopoint_protocol.py"
      - "tests/test_phase7_official_helper_audit.py"
      - "tests/test_phase7_joint_reference.py"
      - "tests/test_phase7_conditional_null.py"
      - "tests/test_phase7_empirical_replica_null.py"
      - "tests/test_phase7_replica_projection_audit.py"
      - ".github/workflows/atlas-phase7-lite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal no-data dependencies
        run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10" "h5py>=3.10,<4"
      - name: Validate stored snapshot and new calculation regressions
        run: |
          python -m pytest -q tests/test_phase7_snapshot.py tests/test_phase7_divisor_audit.py tests/test_phase7_interaction.py tests/test_phase7_target_mc.py tests/test_phase7_crosscov_bounds.py tests/test_phase7_model_sensitivity.py tests/test_phase7_calibration.py tests/test_phase7_replica_manifest.py tests/test_phase7_reference_audit.py tests/test_phase7_v2_reconstruct.py tests/test_phase7_twopoint_protocol.py tests/test_phase7_official_helper_audit.py tests/test_phase7_joint_reference.py tests/test_phase7_conditional_null.py tests/test_phase7_empirical_replica_null.py tests/test_phase7_replica_projection_audit.py
          python -m src.phase7_snapshot verify --root data/derived/phase7-v1
      - name: Evaluate covariance denominator correction without raw data
        run: python -m src.phase7_divisor_audit --snapshot data/derived/phase7-v1 --out outputs/divisor
      - name: Separate mass/track marginals from joint interaction
        run: python -m src.phase7_interaction --snapshot data/derived/phase7-v1 --out outputs/interaction
      - name: Correct known-truth finite-MC log-odds precision
        run: python -m src.phase7_target_mc --snapshot data/derived/phase7-v1 --out outputs/target-mc
      - name: Audit finite-MC cross-covariance range without raw data
        run: python -m src.phase7_crosscov_bounds --snapshot data/derived/phase7-v1 --out outputs/crosscov
      - name: Validate v2 signed shifts by rebuilding all 29 frozen provisional covariance sources
        run: |
          test -f data/derived/phase7-v2/moments.json
          python -m src.phase7_v2_reconstruct --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/v2-continuity
      - name: Test publication-guided four-bin DD/Sherpa correlation alternatives against pseudodata first
        run: python -m src.phase7_twopoint_protocol --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/twopoint
      - name: Reconstruct source-aligned conditional 2x2 covariances on frozen moments
        run: python -m src.phase7_joint_reference --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/joint-reference
      - name: Correctly re-estimate R-1 sample covariances under conditional Gaussian null (not experimental coverage)
        run: python -m src.phase7_conditional_null --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/conditional-toys --toys 5000
      - name: Compare actual released replica shapes to hybrid Gaussian source null (not experiment coverage)
        run: python -m src.phase7_empirical_replica_null --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/replica-null --toys 10000
      - name: Compare raw-count covariance projection against individually normalized replica covariance
        run: python -m src.phase7_replica_projection_audit --v1 data/derived/phase7-v1 --v2 data/derived/phase7-v2 --out outputs/replica-projection
      - name: Probe CERN official helper source without executing fetched code
        run: python -m src.phase7_official_helper_audit --out outputs/official-helper
      - name: Extract official function bodies for human source-method reconciliation
        run: python -m src.phase7_official_excerpts
      - name: Upload only small derived audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-lite-audits-${{ github.run_number }}
          path: outputs/
          retention-days: 14
          if-no-files-found: warn

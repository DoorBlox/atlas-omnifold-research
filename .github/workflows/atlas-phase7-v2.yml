name: ATLAS Phase 7 one-time v2 signed statistics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/v2-request.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-phase7-v2-one-time
  cancel-in-progress: false

jobs:
  capture-signed-moments:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[atlas-v2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies for fixed-format pandas HDF5
        run: python -m pip install "numpy>=1.26,<3" "h5py>=3.10,<4" "pandas>=2.1,<3" "tables>=3.8,<4" "pytest>=8,<10"
      - name: Run v2 extractor and immutable-v1 integrity tests BEFORE expensive download
        run: |
          python -m pytest -q tests/test_phase7_v2_extract.py tests/test_phase7_snapshot.py
          python -m src.phase7_snapshot verify --root data/derived/phase7-v1
          test ! -e data/derived/phase7-v2
          df -h .
      - name: Acquire official verified ZIP, extracting only six required HDF5 supports
        run: |
          python -m src.atlas_preflight --stage schema --include-v2 --root work --out audit
      - name: Build signed four-cell sums and second/mixed moments; compare v1
        run: |
          python -m src.phase7_v2_extract --root work --snapshot data/derived/phase7-v1 --out data/derived/phase7-v2
          python -c "from src.phase7_v2_extract import verify_v2; print(verify_v2('data/derived/phase7-v2'))"
      - name: Verify no event-level data and enforce small output ceiling
        run: |
          test "$(find data/derived/phase7-v2 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find data/derived/phase7-v2 -maxdepth 1 -type f ! -name 'moments.json' ! -name 'provenance.json' | wc -l)" -eq 0
          test "$(stat -c%s data/derived/phase7-v2/moments.json)" -lt 2000000
          du -h data/derived/phase7-v2/*
      - name: Commit only verified small derived v2 summaries, never HDF5 or ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/phase7-v2/moments.json data/derived/phase7-v2/provenance.json
          git diff --cached --name-only
          git commit -m "Freeze official Phase 7 v2 signed four-cell sufficient statistics [skip ci]"
          git push origin HEAD:main
      - name: Post execution and provenance link to research issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          gh issue comment 1 --body "Phase 7 one-time v2 signed-statistics extraction: ${RUN_URL}; job ${RESULT}. Only small aggregate four-cell moments are committed; no raw ATLAS event data. G15 remains NO-GO." || true

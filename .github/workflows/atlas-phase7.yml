name: ATLAS Phase 7 analysis

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/atlas-phase7.yml"
      - "ops/schema-request.txt"
  workflow_dispatch:
    inputs:
      stage:
        description: "smoke = tests; schema = HDF5 audit; projection = descriptive 2x2; covariance = provisional source-wise uncertainty; closure = pseudo truth check; sensitivity = compare existing results; calibration = conditional Gaussian toys; audit = source reference + corrected toys"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - schema
          - projection
          - covariance
          - closure
          - sensitivity
          - calibration
          - audit
      include_target:
        description: "Extract all large alternative/target HDF5 files (more storage required)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: atlas-phase7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked-range dependencies
        run: python -m pip install -r requirements.txt
      - name: Check disk and runtime
        run: |
          df -h .
          python --version
      - name: Run deterministic software tests
        run: python -m pytest -q tests
      - name: Run smoke test
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[atlas-schema]') && !contains(github.event.head_commit.message, '[atlas-projection]') && !contains(github.event.head_commit.message, '[atlas-covariance]') && !contains(github.event.head_commit.message, '[atlas-closure]') && !contains(github.event.head_commit.message, '[atlas-sensitivity]') && !contains(github.event.head_commit.message, '[atlas-calibration]') && !contains(github.event.head_commit.message, '[atlas-audit]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'smoke') }}
        run: python -m src.atlas_preflight --stage smoke --out outputs
      - name: Official ATLAS HDF5 schema preflight (download ~3.6 GB)
        if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[atlas-schema]') || contains(github.event.head_commit.message, '[atlas-projection]') || contains(github.event.head_commit.message, '[atlas-covariance]') || contains(github.event.head_commit.message, '[atlas-closure]'))) || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'schema' || inputs.stage == 'projection' || inputs.stage == 'covariance' || inputs.stage == 'closure')) }}
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_STAGE: ${{ inputs.stage }}
          INCLUDE_TARGET: ${{ inputs.include_target }}
        run: |
          if [[ "$INCLUDE_TARGET" == "true" ]]; then
            python -m src.atlas_preflight --stage schema --include-target --out outputs
          elif [[ "$HEAD_COMMIT_MESSAGE" == *"[atlas-closure]"* || "$REQUESTED_STAGE" == "closure" ]]; then
            python -m src.atlas_preflight --stage schema --include-closure --out outputs
          elif [[ "$HEAD_COMMIT_MESSAGE" == *"[atlas-covariance]"* || "$REQUESTED_STAGE" == "covariance" ]]; then
            python -m src.atlas_preflight --stage schema --include-alternatives --out outputs
          else
            python -m src.atlas_preflight --stage schema --out outputs
          fi
      - name: Real ATLAS descriptive 2x2 projection (G15 stays blocked)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-projection]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'projection') }}
        run: python -m src.projection --root work --out outputs
      - name: Provisional source-wise 2x2 covariance (G15 permanently NO-GO)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-covariance]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'covariance') }}
        run: python -m src.phase7_covariance --root work --out outputs
      - name: Official 2x2 pseudodata known-target closure (uncalibrated)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-closure]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'closure') }}
        run: python -m src.phase7_closure --root work --out outputs
      - name: Download verified published-result artifacts (no large data transfer)
        if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[atlas-sensitivity]') || contains(github.event.head_commit.message, '[atlas-calibration]') || contains(github.event.head_commit.message, '[atlas-audit]'))) || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'sensitivity' || inputs.stage == 'calibration' || inputs.stage == 'audit')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p derived_input/real derived_input/pseudo
          gh run download 42324639484 --name phase7-preflight-12 --dir derived_input/real
          gh run download 42327464929 --name phase7-preflight-17 --dir derived_input/pseudo
          test -f derived_input/real/source_covariances.npz
          test -f derived_input/pseudo/pseudo_source_covariances.npz
      - name: Run nine covariance model sensitivity scenarios (all uncalibrated)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-sensitivity]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'sensitivity') }}
        run: |
          python -m src.phase7_model_sensitivity --real-dir derived_input/real --pseudo-dir derived_input/pseudo --out outputs
      - name: Conditional Gaussian covariance-estimation null calibration (not ATLAS coverage)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-calibration]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'calibration') }}
        run: |
          python -m src.phase7_calibration --real-dir derived_input/real --pseudo-dir derived_input/pseudo --out outputs --toys 10000
      - name: Audit 1D ATLAS reference source families versus 2D prototype
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-audit]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'audit') }}
        run: python -m src.phase7_reference_audit --real-dir derived_input/real --pseudo-dir derived_input/pseudo --out outputs
      - name: Repeat finite-covariance toys with corrected bootstrap manifest counts
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-audit]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'audit') }}
        run: python -m src.phase7_calibration --real-dir derived_input/real --pseudo-dir derived_input/pseudo --out outputs --toys 10000
      - name: Upload lightweight audit artifacts (never raw ATLAS data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-preflight-${{ github.run_number }}
          path: outputs/
          retention-days: 14
          if-no-files-found: ignore
      - name: Report completed workflow status to research issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STATUS: ${{ job.status }}
        run: |
          gh issue comment 1 --body "ATLAS Phase 7 CI run: ${RUN_URL}; job result: ${RUN_STATUS}. Scientific G15 remains **NO-GO** pending official covariance calibration and pseudodata closure. See artifacts and step logs for details." || true

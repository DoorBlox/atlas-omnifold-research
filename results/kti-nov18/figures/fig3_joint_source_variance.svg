<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="668" viewBox="0 0 1060 668" role="img"><title>Conditional source variance shares for joint log-odds</title><desc>Source-level decomposition of the four-cell association under the provisional full/full model</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18314a}.title{font-size:26px;font-weight:bold}.subtitle{font-size:15px;fill:#506779}.panel{font-size:19px;font-weight:bold}.label{font-size:14px}.value{font-size:16px;font-weight:bold}.small{font-size:12px;fill:#52677a}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="48.0" y="52.0" class="title" text-anchor="start">What drives uncertainty in joint association?</text><text x="48.0" y="80.0" class="subtitle" text-anchor="start">Five largest conditional log-odds variance shares under one provisional 2D model</text><rect x="50.0" y="123.0" width="465.0" height="420.0" fill="#f6f9fb" stroke="#dbe4eb" rx="10"/><text x="68.0" y="154.0" class="panel" text-anchor="start">Real vs paired nominal generator</text><text x="68.0" y="199.0" class="label" text-anchor="start">sherpa hidden variable</text><rect x="68.0" y="208.0" width="342.0" height="18.0" fill="#dce6ec" stroke="none" rx="3"/><rect x="68.0" y="208.0" width="328.4" height="18.0" fill="#007c86" stroke="none" rx="3"/><text x="420.0" y="223.0" class="value" text-anchor="start">96.0%</text><text x="68.0" y="263.0" class="label" text-anchor="start">dd unfolding</text><rect x="68.0" y="272.0" width="342.0" height="18.0" fill="#dce6ec" stroke="none" rx="3"/><rect x="68.0" y="272.0" width="3.5" height="18.0" fill="#007c86" stroke="none" rx="3"/><text x="420.0" y="287.0" class="value" text-anchor="start">1.0%</text><text x="68.0" y="327.0" class="label" text-anchor="start">data bootstrap</text><rect x="68.0" y="336.0" width="342.0" height="18.0" fill="#dce6ec" stroke="none" rx="3"/><rect x="68.0" y="336.0" width="2.9" height="18.0" fill="#007c86" stroke="none" rx="3"/><text x="420.0" y
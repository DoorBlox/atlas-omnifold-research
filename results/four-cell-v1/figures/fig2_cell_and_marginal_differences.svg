<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img"><title>Observed four-cell and marginal differences</title><desc>Percentage-point differences of unfolded distributions from their appropriate references</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18314a}.title{font-size:26px;font-weight:bold}.subtitle{font-size:15px;fill:#506779}.panel{font-size:19px;font-weight:bold}.label{font-size:14px}.value{font-size:16px;font-weight:bold}.small{font-size:12px;fill:#52677a}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="48.0" y="53.0" class="title" text-anchor="start">Unfolded minus reference: joint and marginal</text><text x="48.0" y="80.0" class="subtitle" text-anchor="start">Differences in percentage points; zero is descriptive equality, not a test decision</text><rect x="50.0" y="125.0" width="465.0" height="470.0" fill="#f6f9fb" stroke="#dbe4eb" rx="10"/><text x="70.0" y="159.0" class="panel" text-anchor="start">Real − nominal generator</text><line x1="342.0" y1="192" x2="342.0" y2="531" stroke="#758999" stroke-width="1.5"/><text x="68.0" y="220.0" class="label" text-anchor="start">LL</text><rect x="315.2" y="201.0" width="26.8" height="25.0" fill="#d76c46" stroke="none" rx="3"/><text x="308.2" y="220.0" class="small" text-anchor="end">-0.545 pp</text><text x="68.0" y="272.0" class="label" text-anchor="start">LH</text><rect x="342.0" y="253.0" width="44.9" height="25.0" fill="#007c86" stroke="none" rx="3"/><text x="393.9" y="272.0" class="small" text-anchor="start">+0.913 pp</text><text x="68.0" y="324.0" class="label" text-anchor="start">HL</text><rect x="296.5" y="305.0" width="45.5" height="25.0" fill="#d76c46" stroke="none" rx="3"/><text x="289.5" y="324.0" class="small" text-anchor="end">-0.924 pp</text><text x="68.0" y="376.0" class="label" text-anchor="start">HH</text><rect x="342.0" y="357.0" width="27.4" height="25.0" fill="#007c86" stroke="none" rx="3"/><text x="376.4" y="376.0